[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "linqy"                     # change if the name is taken
version = "0.1.1"
description = "LINQ-style lazy query operators for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["linq", "query", "lazy", "iterable", "functional"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/YOUR_USER/linqy"
Issues = "https://github.com/YOUR_USER/linqy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linqy = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
